[project]
name = "ronglat-nlp-analyzer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask>=3.1,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "torch==2.6.0+cpu",
    "vercel>=0.12.2,<0.13",
]

[tool.vercel]
entrypoint = "webapp.server:app"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
